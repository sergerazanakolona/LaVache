<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaVache - Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .login-card {
      border-radius: 1.25rem;
      box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .login-header {
      background: #ffffff;
      padding: 2rem 2rem 1rem;
      text-align: center;
    }

    .logo-circle {
      width: 70px;
      height: 70px;
      background: #0d6efd;
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    .btn-login {
      padding: 0.75rem;
      font-weight: 600;
      border-radius: 0.5rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">

        <div class="card login-card border-0">
          <!-- Header -->
          <div class="login-header">
            <div class="logo-circle">LV</div>
            <h4 class="fw-bold mb-1">LaVache</h4>
            <p class="text-muted mb-0">Offres hôtels de dernière minute</p>
          </div>

          <div class="card-body p-4 pt-3">

            <!-- Formulaire de connexion -->
            <form action="login.php" method="POST">

              <div class="mb-3">
                <label for="email" class="form-label">Adresse email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input type="email" class="form-control" id="email" name="email" placeholder="ex: vous@email.com"
                    required>
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input type="password" class="form-control" id="password" name="password" placeholder="••••••••"
                    required>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label" for="remember">
                    Se souvenir de moi
                  </label>
                </div>
                <a href="#" class="text-decoration-none small">Mot de passe oublié ?</a>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-login">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                </button>
              </div>

              <div class="text-center">
                <p class="mb-0 text-muted small">
                  Pas encore de compte ?
                  <a href="#" class="text-decoration-none fw-semibold">Créer un compte</a>
                </p>
              </div>

            </form>

          </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-4">
          <p class="text-white-50 small mb-0">
            © 2026 LaVache – Tous droits réservés
          </p>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

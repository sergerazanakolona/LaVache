<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — La Vache Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <h1 class="mb-4 text-center">Dashboard — Réservations</h1>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            Liste des réservations
        </div>

        <div class="card-body">
            <table class="table table-bordered table-striped" id="reservationsTable">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nom Hôtel</th>
                        <th>Cat</th>
                        <th>CHB</th>
                        <th>Prix</th>
                        <th>Adresse</th>
                        <th>Tel</th>
                        <th>Email</th>
                        <th>Nom Complet</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reservationsBody">
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
// Charger les réservations
function loadReservations() {
    fetch('list.php')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('reservationsBody');
            tbody.innerHTML = '';

            data.data.forEach(row => {
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td>${row.id}</td>
                    <td>${row.hotel_nom}</td>
                    <td>${row.hotel_cat}</td>
                    <td>${row.hotel_chb}</td>
                    <td>${row.hotel_prix}</td>
                    <td>${row.adresse}</td>
                    <td>${row.tel}</td>
                    <td>${row.email}</td>
                    <td>${row.nom_complet}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editReservation(${row.id})">Modifier</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteReservation(${row.id})">Supprimer</button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        });
}

// Supprimer une réservation
function deleteReservation(id) {
    if (!confirm("Supprimer cette réservation ?")) return;

    fetch('delete.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        loadReservations();
    });
}

// Modifier une réservation
function editReservation(id) {
    const newNom = prompt("Nouveau nom d'hôtel :");
    if (!newNom) return;

    fetch('update.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            id,
            hotel_nom: newNom,
            hotel_cat: "MOD",
            hotel_chb: "MOD",
            hotel_prix: "MOD",
            adresse: "MOD",
            tel: "MOD",
            email: "MOD",
            nom_complet: newNom + " COMPLET"
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        loadReservations();
    });
}

// Charger au démarrage
loadReservations();
</script>

</body>
</html>

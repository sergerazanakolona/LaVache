<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaVache - Téléchargement des fichiers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .download-card {
      border-radius: 1.25rem;
      box-shadow: 0 1rem 2.5rem rgba(0,0,0,0.15);
    }
    .logo-circle {
      width: 80px;
      height: 80px;
      background: #0d6efd;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem;
    }
    .btn-download {
      padding: 0.9rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 0.6rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">

        <div class="card download-card border-0">
          <div class="card-body p-5 text-center">

            <!-- Logo -->
            <div class="logo-circle">LV</div>
            <h3 class="fw-bold mb-1">LaVache</h3>
            <p class="text-muted mb-4">Téléchargement des interfaces</p>

            <!-- Boutons de téléchargement -->
            <div class="d-grid gap-3">

              <!-- Bouton hotelier.html -->
              <a href="hotelier.html" download="hotelier.html" class="btn btn-primary btn-download">
                <i class="bi bi-building me-2"></i>
                Télécharger hotelier.html
              </a>

              <!-- Bouton utilisateur.html -->
              <a href="utilisateur.html" download="utilisateur.html" class="btn btn-success btn-download">
                <i class="bi bi-people me-2"></i>
                Télécharger utilisateur.html
              </a>

              <!-- Bouton connexion.html (bonus) -->
              <a href="connexion.html" download="connexion.html" class="btn btn-outline-primary btn-download">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Télécharger connexion.html
              </a>

            </div>

            <hr class="my-4">

            <p class="small text-muted mb-0">
              Placez les 3 fichiers dans le même dossier<br>
              puis ouvrez <strong>index.html</strong> dans votre navigateur.
            </p>

          </div>
        </div>

        <div class="text-center mt-4">
          <p class="text-white-50 small mb-0">
            © 2026 LaVache – Tous droits réservés
          </p>
        </div>

      </div>
    </div>
  </div>

</body>
</html>

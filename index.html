<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La Vache hotel slave — Bootstrap 5</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            font-family: system-ui, sans-serif;
        }
        .qr-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
</head>
<body class="bg-light">
    <!-- NAVBAR LA VACHE -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid">
        <!-- Logo et Titre -->
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
            <img src="cow.png" alt="La Vache" style="height:30px;">
            <span>La Vache</span>
        </a>
        
        <!-- Bouton Menu Mobile (Hamburger) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#lavacheNavbar" aria-controls="navbarsExample04" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Liens de navigation -->
        <div class="collapse navbar-collapse" id="lavacheNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" id="nav-home" href="index.html">🏠 Accueil / Saisie</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="nav-dashboard" href="dashboard.html">📊 Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="nav-install" href="install.html">📲 Installer l'App</a>
                </li>
            </ul>
            
            <!-- Lien vers la vue client en bonus -->
            <div class="d-flex">
                <a class="btn btn-outline-info btn-sm" href="user.html" target="_blank">👁️ Voir le site client</a>
            </div>
        </div>
    </div>
</nav>


    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#reservationModal">
        Ouvrir La Vache
    </button>

    <div class="modal fade" id="reservationModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title w-100">
                        <div class="row align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <img src="cow.png" alt="La Vache" style="height:32px;">
                                <span class="fw-bold fs-4">La Vache</span>
                                <div class="border rounded shadow-sm bg-white p-2">
                                    <span id="header-datetime" class="text-muted fw-normal" style="font-size: 15px; white-space:nowrap;"></span>
                                </div>
                            </div>
                        </div>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="row g-1 mb-2">
                        <div class="col">
                            <input type="text" class="form-control form-control-sm" id="hotel-hotel" placeholder="Hotel">
                        </div>
                        <div class="col-auto">
                            <input type="text" class="form-control form-control-sm" id="hotel-cat" placeholder="cat*" style="width:70px;">
                        </div>
                        <div class="col-auto">
                            <input type="text" class="form-control form-control-sm" id="hotel-chbcat" placeholder="chb cat" style="width:100px;">
                        </div>
                        <div class="col-auto">
                            <input type="text" class="form-control form-control-sm" id="hotel-prix" placeholder="prix €" style="width:90px;">
                        </div>
                    </div>

                    <div class="mb-2">
                        <input type="text" class="form-control form-control-sm" id="hotel-address" placeholder="Adresse">
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-4">
                            <input type="text" class="form-control form-control-sm" id="hotel-phone" placeholder="Téléphone">
                        </div>
                        <div class="col-8">
                            <input type="email" class="form-control form-control-sm" id="hotel-email" placeholder="Email">
                        </div>
                    </div>

                    <div class="mb-2">
                        <input type="url" class="form-control form-control-sm" id="hotel-url" placeholder="URL réservation">
                    </div>
                </div>

                <div class="modal-footer">
                    <div class="w-100 d-flex flex-wrap gap-2 mb-2">
                        <button id="btn-close" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button class="btn btn-primary" onclick="shareOffer()">Share</button>
                        <button class="btn btn-secondary" onclick="showQR()">QR Code</button>
                        <button id="btn-reserve" class="btn btn-primary">Réserver</button>
                        <button id="btn-sendhash" class="btn btn-success">Publier</button>
                    </div>

                    <div class="row w-100">
                        <div class="col-6">
                            <button class="btn btn-warning btn-sm w-100" onclick="askNotificationPermission()">Activer Notification</button>
                        </div>
                        <div class="col-6">
                            <a href="install.html" class="btn btn-primary btn-sm w-100">Installer Application</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Met en surbrillance automatique le lien de la page actuelle dans la Navbar
const currentPage = window.location.pathname.split("/").pop() || "index.html";
if (currentPage === "index.html" || currentPage === "") document.getElementById("nav-home")?.classList.add("active");
if (currentPage === "dashboard.html") document.getElementById("nav-dashboard")?.classList.add("active");
if (currentPage === "install.html") document.getElementById("nav-install")?.classList.add("active");

        // Affichage optionnel de la date et heure du jour dans l'en-tête
        const dateEl = document.getElementById('header-datetime');
        if (dateEl) {
            dateEl.textContent = new Date().toLocaleDateString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        function clearFields(){
            [
                "hotel-hotel",
                "hotel-cat",
                "hotel-chbcat",
                "hotel-prix",
                "hotel-address",
                "hotel-phone",
                "hotel-email",
                "hotel-url"
            ]
            .forEach(id=>{
                const el = document.getElementById(id);
                if(el){ el.value = ""; }
            });
        }

        document.getElementById('btn-close').addEventListener('click', clearFields);

        document.getElementById('btn-reserve').addEventListener('click', ()=>{
            const url = document.getElementById('hotel-url').value;
            if(!url){
                alert("Ajoutez une URL de réservation");
                return;
            }
            window.open(url, "_blank");
        });

        document.getElementById('btn-sendhash').addEventListener('click', ()=>{
            const data = {
                hotel_nom: document.getElementById('hotel-hotel').value,
                hotel_cat: document.getElementById('hotel-cat').value,
                hotel_chbcat: document.getElementById('hotel-chbcat').value,
                hotel_prix: document.getElementById('hotel-prix').value,
                adresse: document.getElementById('hotel-address').value,
                tel: document.getElementById('hotel-phone').value,
                email: document.getElementById('hotel-email').value,
                hotel_url: document.getElementById('hotel-url').value
            };

            console.log("Données envoyées :", data);

            fetch("reserve.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },            
                body: JSON.stringify(data)
            })
            .then(response => response.text())
            .then(response => {
                console.log("Réponse reserve.php :");
                console.log(response);
                alert(response);
            })
            .catch(error => {
                console.error("Erreur Fetch :", error);
            });
        });

        function shareOffer(){
            const text = `🏨 ${document.getElementById('hotel-hotel').value}
⭐ ${document.getElementById('hotel-cat').value}
🛏 ${document.getElementById('hotel-chbcat').value}
💶 ${document.getElementById('hotel-prix').value}
📍 ${document.getElementById('hotel-address').value}
📞 ${document.getElementById('hotel-phone').value}
✉ ${document.getElementById('hotel-email').value}
🔗 ${document.getElementById('hotel-url').value}`;

            if(navigator.share){
                navigator.share({
                    title: 'La Vache',
                    text: text,
                    url: document.getElementById('hotel-url').value
                });
            } else {
                navigator.clipboard.writeText(text);
                alert("Offre copiée dans le presse-papiers");
            }
        }

        function showQR(){
            const url = document.getElementById('hotel-url').value || window.location.href;
            const qrUrl = "https://qrserver.com" + encodeURIComponent(url);
            const modal = document.createElement("div");
            modal.className = "qr-modal";

            const img = document.createElement("img");
            img.src = qrUrl;
            img.style.width = "250px";
            img.style.border = "8px solid white";
            img.style.borderRadius = "10px";

            modal.appendChild(img);
            modal.onclick = () => { modal.remove(); };
            document.body.appendChild(modal);
        }

        function askNotificationPermission(){
            Notification.requestPermission().then(permission=>{
                if(permission==="granted"){
                    alert("Notifications activées");
                }else{
                    alert("Notifications refusées");
                }
            });
        }

        if("serviceWorker" in navigator){
            navigator.serviceWorker.register("/service-worker.js")
            .then(()=>{ console.log("Service Worker enregistré avec succès !"); })
            .catch(err => { console.log("Échec SW:", err); });
        } 
                // ... (votre code JavaScript précédent pour shareOffer, showQR, etc.)

        function askNotificationPermission(){
            Notification.requestPermission().then(permission=>{
                if(permission==="granted"){
                    alert("Notifications activées");
                }else{
                    alert("Notifications refusées");
                }
            });
        }

        // ENREGISTREMENT DU SERVICE WORKER (Correctement placé dans le HTML)
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js")
                .then(reg => console.log("Service Worker enregistré avec succès !", reg.scope))
                .catch(err => console.error("Échec de l'enregistrement du Service Worker :", err));
            });
        }

    </script>
</body>
</html>

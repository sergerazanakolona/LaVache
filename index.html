<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>La Vache hotel slave — Bootstrap 5</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />


  <style>
    body {
      font-family: system-ui, sans-serif;
    }
    .qr-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
  </style>
</head>

<body class="bg-light p-4">

  <!-- Bouton d'ouverture -->
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#reservationModal">
    Ouvrir La Vache 
  </button>

  <!-- MODALE -->
  <div class="modal fade" id="reservationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <!-- HEADER --> 
          <div class="modal-header">
          <h5 class="modal-title">
            La Vache <img src="cow.png" alt="cow icon" style="height:32px; width:auto; margin:0 10px;">
            <span id="popup-date" class="text-muted"></span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          

        <!-- BODY --> 
        <div class="modal-body">

          <!-- Ligne 1 -->
          <div class="row g-2 mb-3">
            <div class="col-10 col-md-5">
              <input type="text" class="form-control" id="hotel-hotel" placeholder="Hotel">
            </div>

            <div class="col-2 col-md-1">
              <input type="text" class="form-control" id="hotel-cat" placeholder="cat*">
            </div>

            <div class="col-6 col-md-3">
              <input type="text" class="form-control" id="hotel-chbcat" placeholder="chb cat">
            </div>

            <div class="col-6 col-md-3">
              <input type="text" class="form-control" id="hotel-prix" placeholder="prix€">
            </div>
          </div>

          <!-- Adresse -->
          <div class="mb-3">
            <input type="text" class="form-control" id="hotel-address" placeholder="Adresse">
          </div>

          <!-- Téléphone + Email -->
          <div class="row g-2 mb-3">
            <div class="col-6">
              <input type="tel" class="form-control" id="hotel-phone" placeholder="Téléphone">
            </div>
            <div class="col-6">
              <input type="email" class="form-control" id="hotel-email" placeholder="Email">
            </div>
          </div>

          <!-- URL de réservation --> 
           <!--
          <div class="mb-3">
            <input type="text" class="form-control" id="hotel-url" placeholder="URL de réservation (Booking, site hôtel...)">
          </div>
        -->
        </div>

        <!-- FOOTER -->
        <div class="modal-footer d-flex justify-content-between">

          <button id="btn-close" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>

          <button class="btn btn-primary" onclick="shareOffer()">Share</button>

          <button class="btn btn-secondary" onclick="showQR()">QR Code</button>

          <button id="btn-reserve" class="btn btn-primary">Réserver</button>

          <button id="btn-sendhash" class="btn btn-success">Publier</button> 

 <div class="row mb-3">
    <div class="col-6">
        <button class="btn btn-warning btn-sm w-100" onclick="askNotificationPermission()">
            Activer.la.Notification
        </button>
    </div>

    <div class="col-6">
        <a href="install.html" class="btn btn-primary btn-sm w-100">
            Installer.l'Application
        </a>
 
    </div>
</div>

</div>

        </div>

      </div>
    </div>
  </div>

  <script>

    /* ------------------------------
       1. Mettre la date du jour
    ------------------------------ */
    function setTodayDate() {
      const now = new Date();
      const options = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
      const formatted = now.toLocaleDateString('fr-FR', options);
      const finalDate = formatted.charAt(0).toUpperCase() + formatted.slice(1);
      document.getElementById('popup-date').textContent = finalDate;
    }

    document.getElementById('reservationModal')
      .addEventListener('shown.bs.modal', setTodayDate);


    /* ------------------------------
       2. Vider les champs
    ------------------------------ */
    function clearFields() {
      [
        "hotel-hotel", "hotel-cat", "hotel-chbcat", "hotel-prix",
        "hotel-address", "hotel-phone", "hotel-email", "hotel-url"
      ].forEach(id => document.getElementById(id).value = "");
    }

    document.getElementById('btn-close')
      .addEventListener('click', clearFields);


    /* ------------------------------
       3. Bouton Réserver
    ------------------------------ */
    document.getElementById('btn-reserve').addEventListener('click', () => {
      const url = document.getElementById('hotel-url').value;
      if (!url) return alert("Ajoutez l'URL de réservation");
      window.open(url, "_blank");
    });


    /* ------------------------------
       4. Publier (workflow light)
    ------------------------------ */
    document.getElementById('btn-sendhash').addEventListener('click', () => {

      const data = {
        hotel_nom: document.getElementById('hotel-hotel').value,
        hotel_cat: document.getElementById('hotel-cat').value,
        hotel_chb: document.getElementById('hotel-chbcat').value,
        hotel_prix: document.getElementById('hotel-prix').value,
        adresse: document.getElementById('hotel-address').value,
        tel: document.getElementById('hotel-phone').value,
        email: document.getElementById('hotel-email').value
      };

      fetch("reserve.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        if (response.success) {
          alert("Offre publiée !");
          clearFields();
        } else {
          alert("Erreur : " + response.error);
        }
      });
    });


    /* ------------------------------
       5. Share corrigé
    ------------------------------ */
    function shareOffer() {

      const hotel = {
        nom: document.getElementById('hotel-hotel').value,
        cat: document.getElementById('hotel-cat').value,
        chb: document.getElementById('hotel-chbcat').value,
        prix: document.getElementById('hotel-prix').value,
        adresse: document.getElementById('hotel-address').value,
        tel: document.getElementById('hotel-phone').value,
        email: document.getElementById('hotel-email').value,
        url: document.getElementById('hotel-url').value || window.location.href
      };

      const text = `
Offre Hôtel : ${hotel.nom}
Catégorie : ${hotel.cat}⭐
Chambre : ${hotel.chb}
Prix : ${hotel.prix} €
Adresse : ${hotel.adresse}
Téléphone : ${hotel.tel}
Email : ${hotel.email}
Réserver : ${hotel.url}
`.trim();

      if (navigator.share) {
        navigator.share({
          title: hotel.nom,
          text: text,
          url: hotel.url
        });
        return;
      }

      navigator.clipboard.writeText(text);
      alert("Offre copiée dans le presse‑papier.");
    }


    /* ------------------------------
       6. QR Code intégré
    ------------------------------ */
    function showQR() {
      const url = window.location.href;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(url)}`;

      const modal = document.createElement("div");
      modal.className = "qr-modal";

      const img = new Image();
      img.src = qrUrl;
      img.style.width = "250px";
      img.style.border = "8px solid white";
      img.style.borderRadius = "12px";
      img.style.boxShadow = "0 0 20px rgba(255,255,255,0.6)";

      modal.appendChild(img);

      modal.onclick = () => modal.remove();

      document.body.appendChild(modal);
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker enregistré"));
    }

    function askNotificationPermission() {
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("Notifications activées !");
        } else {
          alert("Notifications refusées.");
        }
      });
    }

  </script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js");
}
</script>

</body>
<div class="modal-footer"></div>

</html>

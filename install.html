<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Installer l'application</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">Installer l'application</h1>

    <div class="card shadow-sm">
        <div class="card-body text-center">

            <p class="mb-3">
                Installez <strong>La Vache Hotel Slave</strong> sur votre tablette ou smartphone pour une expérience rapide et hors connexion.
            </p>

            <button id="installBtn" class="btn btn-primary btn-lg" disabled>
                Installer l'application
            </button>

            <p id="status" class="mt-3 text-muted"></p>
        </div>
    </div>
</div> 

<div class="mt-4 text-center">
    <p>Scannez ce QR Code pour ouvrir ou installer l'application :</p>
    <div id="qrcode"></div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="qr-install.js"></script>


<script src="install.js"></script>
</body>
</html>

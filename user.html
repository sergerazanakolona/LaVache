<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>La Vache - Offre du jour</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.offer-card{
    max-width:700px;
    margin:auto;
}

#tm-clock-box{
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(6px);
    padding:4px 12px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    text-align:center;
    min-width:240px;
}

#tm-clock{
    font-family:'Segoe UI Light','Inter','Roboto',sans-serif;
    font-size:14px;
    font-weight:400;
    color:#222;
    white-space:nowrap;
}

.badge-offer{
    font-size:.9rem;
}

.qr-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.8);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

@media(max-width:576px){

    #tm-clock-box{
        min-width:auto;
        padding:3px 8px;
    }

    #tm-clock{
        font-size:11px;
    }

}

</style>

</head>

<body>

<div class="container py-3">

<div class="card offer-card shadow-sm">

<div class="card-body">

<!-- HEADER -->

<div class="d-flex justify-content-between align-items-center mb-3">

<div class="d-flex align-items-center gap-2 flex-wrap">

<img
    src="cow.png"
    alt="La Vache"
    style="height:32px;">

<span class="fw-normal fs-5">
    Today's Last Rooms
</span>

</div>

<div id="tm-clock-box">

<div id="tm-clock">

Chargement...

</div>

</div>

</div>

<!-- OFFRE -->

<div class="row align-items-center g-2 mb-3">

<div class="col">

<input
    type="text"
    id="hotel-name"
    class="form-control form-control-sm fw-bold"
    value=""
    readonly>

</div>

<div class="col-auto">

<span
    id="hotel-cat"
    class="badge bg-secondary badge-offer">

    -

</span>

</div>

<div class="col-auto">

<span
    id="hotel-room"
    class="badge bg-info text-dark badge-offer">

    -

</span>

</div>

<div class="col-auto">

<span
    id="hotel-price"
    class="badge bg-success badge-offer">

    -

</span>

</div>

</div>

<!-- ADRESSE -->

<div
    id="hotel-address"
    class="small text-muted mb-3">

    📍 Adresse indisponible

</div>

<!-- CONTACT -->

<div
    id="hotel-contact"
    class="small mb-3">

    📞
    <br>
    ✉

</div>

<!-- ACTIONS -->

<div class="row g-2 mb-3">

<div class="col-4">

<button
    class="btn btn-primary btn-sm w-100"
    onclick="shareOffer()">

    Share

</button>

</div>

<div class="col-4">

<button
    class="btn btn-secondary btn-sm w-100"
    onclick="showQRCode()">

    QR Code

</button>

</div>

<div class="col-4">

<button
    class="btn btn-success btn-sm w-100"
    onclick="reserveOffer()">

    Réserver

</button>

</div>

</div>

<!-- PWA -->

<div class="row g-2">

<div class="col-6">

<button
    class="btn btn-warning btn-sm w-100"
    onclick="askNotificationPermission()">

    Notification

</button>

</div>

<div class="col-6">

<button
    class="btn btn-primary btn-sm w-100"
    onclick="installApp()">

    Installer

</button>

</div>

</div>

</div>

</div>

</div>

<script>

/* -----------------------------------
   Variables globales
----------------------------------- */

let bookingUrl = "";

/* -----------------------------------
   Horloge
----------------------------------- */

function updateHeader(){

    const now = new Date();

    const weekday =
        now.toLocaleDateString(
            'fr-FR',
            {weekday:'long'}
        );

    const month =
        now.toLocaleDateString(
            'fr-FR',
            {month:'long'}
        );

    const day =
        String(now.getDate())
        .padStart(2,'0');

    const h =
        String(now.getHours())
        .padStart(2,'0');

    const m =
        String(now.getMinutes())
        .padStart(2,'0');

    const s =
        String(now.getSeconds())
        .padStart(2,'0');

    const formatted =

        weekday.charAt(0).toUpperCase() +
        weekday.slice(1) +
        ' ' +
        day +
        ' ' +
        month.charAt(0).toUpperCase() +
        month.slice(1);

    document.getElementById('tm-clock')
        .textContent =
        `${formatted} | ${h}:${m}:${s}`;
}

updateHeader();
setInterval(updateHeader,1000);

/* -----------------------------------
   Chargement de l'offre
----------------------------------- */

async function loadOffer(){

    try{

        const response =
            await fetch('list.php');

        const data =
            await response.json();

        document.getElementById('hotel-name').value =
            data.hotel_nom || '';

        document.getElementById('hotel-cat').textContent =
            data.hotel_cat || '-';

        document.getElementById('hotel-room').textContent =
            data.hotel_chbcat || '-';

        document.getElementById('hotel-price').textContent =
            data.hotel_prix
            ? data.hotel_prix + ' €'
            : '-';

        document.getElementById('hotel-address').innerHTML =
            '📍 ' +
            (data.adresse || 'Adresse indisponible');

        document.getElementById('hotel-contact').innerHTML =
            '📞 ' +
            (data.tel || '') +
            '<br>✉ ' +
            (data.email || '');

        bookingUrl =
            data.hotel_url || '';

    }
    catch(error){

        console.error(error);

    }

}

loadOffer();

/* -----------------------------------
   Share
----------------------------------- */

async function shareOffer(){

    const text =

`🏨 ${document.getElementById('hotel-name').value}
⭐ ${document.getElementById('hotel-cat').textContent}
🛏 ${document.getElementById('hotel-room').textContent}
💶 ${document.getElementById('hotel-price').textContent}
📍 ${document.getElementById('hotel-address').textContent}`;

    if(navigator.share){

        await navigator.share({

            title:'La Vache',

            text:text,

            url:window.location.href

        });

    }
    else{

        navigator.clipboard.writeText(text);

        alert('Offre copiée');

    }

}

/* -----------------------------------
   QR CODE
----------------------------------- */

function showQRCode(){

    const qrUrl =
    "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +
    encodeURIComponent(window.location.href);

    const overlay =
        document.createElement("div");

    overlay.className =
        "qr-overlay";

    const img =
        document.createElement("img");

    img.src = qrUrl;

    img.style.background =
        "#fff";

    img.style.padding =
        "10px";

    img.style.borderRadius =
        "10px";

    img.style.width =
        "250px";

    overlay.appendChild(img);

    overlay.onclick = ()=>{

        overlay.remove();

    };

    document.body.appendChild(
        overlay
    );

}

/* -----------------------------------
   Réservation
----------------------------------- */

function reserveOffer(){

    if(!bookingUrl){

        alert(
            "URL de réservation indisponible"
        );

        return;

    }

    window.open(
        bookingUrl,
        "_blank"
    );

}

/* -----------------------------------
   Notifications
----------------------------------- */

function askNotificationPermission(){

    Notification
    .requestPermission()
    .then(permission=>{

        if(permission==="granted"){

            alert(
                "Notifications activées"
            );

        }

    });

}

/* -----------------------------------
   Installation PWA
----------------------------------- */

let deferredPrompt;

window.addEventListener(
    'beforeinstallprompt',
    (e)=>{

        e.preventDefault();

        deferredPrompt = e;

    }
);

async function installApp(){

    if(!deferredPrompt){

        alert(
            "Installation non disponible"
        );

        return;

    }

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

}

/* -----------------------------------
   Service Worker
----------------------------------- */

if("serviceWorker" in navigator){

    navigator.serviceWorker
    .register("/service-worker.js")
    .then(()=>{

        console.log(
            "Service Worker enregistré"
        );

    });

}

</script>

</body>
</html>

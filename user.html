<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La Vache - Offre du jour</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
        }
        .offer-card {
            max-width: 700px;
            margin: auto;
        }
        #tm-clock-box {
            background: rgba(255,255,255,.35);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,.10);
            text-align: center;
            min-width: 240px;
        }
        #tm-clock {
            font-family: 'Segoe UI Light', 'Inter', 'Roboto', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #222;
            white-space: nowrap;
        }
        .badge-offer {
            font-size: .9rem;
        }
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        @media(max-width:576px) {
            #tm-clock-box {
                min-width: auto;
                padding: 3px 8px;
            }
            #tm-clock {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="card offer-card shadow-sm">
        <div class="card-body">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <img src="cow.png" alt="La Vache" style="height:32px;">
                    <span class="fw-normal fs-5">Today's Last Rooms</span>
                </div>
                <div id="tm-clock-box">
                    <div id="tm-clock">Chargement...</div>
                </div>
            </div>

            <!-- OFFRE -->
            <div class="row align-items-center g-2 mb-3">
                <div class="col">
                    <input type="text" id="hotel-name" class="form-control form-control-sm fw-bold" value="Chargement de l'offre..." readonly>
                </div>
                <div class="col-auto">
                    <span id="hotel-cat" class="badge bg-secondary badge-offer">-</span>
                </div>
                <div class="col-auto">
                    <span id="hotel-room" class="badge bg-info text-dark badge-offer">-</span>
                </div>
                <div class="col-auto">
                    <span id="hotel-price" class="badge bg-success badge-offer">-</span>
                </div>
            </div>

            <!-- ADRESSE -->
            <div id="hotel-address" class="small text-muted mb-3">
                📍 Adresse indisponible
            </div>

            <!-- CONTACT -->
            <div id="hotel-contact" class="small mb-3">
                📞 <br> ✉
            </div>

            <!-- ACTIONS -->
            <div class="row g-2 mb-3">
                <div class="col-4">
                    <button class="btn btn-primary btn-sm w-100" onclick="shareOffer()">Share</button>
                </div>
                <div class="col-4">
                    <button class="btn btn-secondary btn-sm w-100" onclick="showQRCode()">QR Code</button>
                </div>
                <div class="col-4">
                    <button class="btn btn-success btn-sm w-100" onclick="reserveOffer()">Réserver</button>
                </div>
            </div>

            <!-- PWA -->
            <div class="row g-2">
                <div class="col-6">
                    <button class="btn btn-warning btn-sm w-100" onclick="askNotificationPermission()">Notification</button>
                </div>
                <div class="col-6">
                    <button id="pwaInstallBtn" class="btn btn-primary btn-sm w-100" onclick="installApp()" disabled>Installer</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
/* -----------------------------------
   Variables globales
----------------------------------- */
let bookingUrl = "";
let deferredPrompt = null;

/* -----------------------------------
   Horloge temps réel
----------------------------------- */
function updateHeader(){
    const now = new Date();
    const weekday = now.toLocaleDateString('fr-FR', {weekday:'long'});
    const month = now.toLocaleDateString('fr-FR', {month:'long'});
    const day = String(now.getDate()).padStart(2,'0');
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');

    const formatted = weekday.charAt(0).toUpperCase() + weekday.slice(1) + ' ' + day + ' ' + month.charAt(0).toUpperCase() + month.slice(1);
    document.getElementById('tm-clock').textContent = `${formatted} | ${h}:${m}:${s}`;
}
updateHeader();
setInterval(updateHeader, 1000);

/* -----------------------------------
   Chargement de la dernière offre
----------------------------------- */
async function loadOffer(){
    try {
        // CORRECTION : On cible offer.php pour avoir la DERNIÈRE offre unique, pas list.php
        const response = await fetch('offer.php');
        const data = await response.json();

        if (data.status === "error") {
            document.getElementById('hotel-name').value = "Aucune offre disponible";
            return;
        }

        // Hydratation de l'interface graphique (Liaisons SQL corrigées)
        document.getElementById('hotel-name').value = data.hotel_nom || 'Hôtel non spécifié';
        document.getElementById('hotel-cat').textContent = data.hotel_cat ? data.hotel_cat + ' ★' : '-';
        document.getElementById('hotel-room').textContent = data.hotel_chbcat || '-';
        document.getElementById('hotel-price').textContent = data.hotel_prix ? data.hotel_prix + ' €' : '-';
        
        document.getElementById('hotel-address').innerHTML = '📍 ' + (data.adresse || 'Adresse indisponible');
        document.getElementById('hotel-contact').innerHTML = '📞 ' + (data.tel || 'Non renseigné') + '<br>✉ ' + (data.email || 'Non renseigné');

        bookingUrl = data.hotel_url || '';
    } catch(error) {
        console.error("Erreur d'envoi/chargement de l'offre :", error);
        document.getElementById('hotel-name').value = "Erreur de connexion au serveur local XAMPP";
    }
}
loadOffer();

/* -----------------------------------
   Partage Natif
----------------------------------- */
async function shareOffer(){
    const text = `🏨 ${document.getElementById('hotel-name').value}
⭐ ${document.getElementById('hotel-cat').textContent}
🛏 ${document.getElementById('hotel-room').textContent}
💶 ${document.getElementById('hotel-price').textContent}
📍 ${document.getElementById('hotel-address').textContent}`;

    if(navigator.share){
        await navigator.share({
            title: 'La Vache - Offre Exclusive',
            text: text,
            url: bookingUrl || window.location.href // Partage l'URL de réservation en priorité
        });
    } else {
        navigator.clipboard.writeText(`${text}\n🔗 Réserver ici : ${bookingUrl}`);
        alert('Offre copiée dans le presse-papiers !');
    }
}

/* -----------------------------------
   Génération et affichage du QR Code
----------------------------------- */
function showQRCode(){
    const urlTarget = bookingUrl || window.location.href;
    const qrUrl = "https://qrserver.com" + encodeURIComponent(urlTarget);

    const overlay = document.createElement("div");
    overlay.className = "qr-overlay";

    const img = document.createElement("img");
    img.src = qrUrl;
    img.style.background = "#fff";
    img.style.padding = "10px";
    img.style.borderRadius = "10px";
    img.style.width = "250px";
    img.style.boxShadow = "0 4px 20px rgba(0,0,0,0.5)";

    overlay.appendChild(img);
    overlay.onclick = () => { overlay.remove(); };
    document.body.appendChild(overlay);
}

/* -----------------------------------
   Redirection vers la Réservation
----------------------------------- */
function reserveOffer(){
    if(!bookingUrl){
        alert("URL de réservation indisponible pour cette offre.");
        return;
    }
    window.open(bookingUrl, "_blank");
}

/* -----------------------------------
   Permissions Notifications PWA
----------------------------------- */
function askNotificationPermission(){
    Notification.requestPermission().then(permission => {
        if(permission === "granted"){
            alert("Notifications activées avec succès !");
        } else {
            alert("Notifications refusées.");
        }
    });
}

/* -----------------------------------
   Gestionnaire d'installation de la PWA
----------------------------------- */
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    
    // On active le bouton d'installation Bootstrap maintenant que l'app est reconnue installable
    const btn = document.getElementById("pwaInstallBtn");
    if (btn) btn.removeAttribute("disabled");
});

async function installApp() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`Résultat demande d'installation : ${outcome}`);
    deferredPrompt = null;
    
    const btn = document.getElementById("pwaInstallBtn");
    if (btn) btn.setAttribute("disabled", true);
}
</script>
</body>
</html>

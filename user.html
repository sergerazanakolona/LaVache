<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>La Vache - Offre du jour</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }

        .offer-card {
            max-width: 700px;
            margin: auto;
        }

        #popup-date {
            font-size: 20px;
            white-space: nowrap;
        }

       #tm-clock-box {
    background: rgba(255, 255, 255, .35);
    backdrop-filter: blur(6px);
    padding: 4px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, .10);
    text-align: center;
    min-width: 240px;
}

#tm-clock {
    font-family: 'Segoe UI Light', 'Inter', 'Roboto', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: #222;
    white-space: nowrap;
}

@media (max-width:576px) {

    #tm-clock-box {
        min-width: auto;
        padding: 3px 8px;
    }

    #tm-clock {
        font-size: 11px;
    }
}

        }
    </style>

</head>

<body>

    <div class="container py-3">

        <div class="card offer-card shadow-sm">

            <div class="card-body">

                <!-- Header -->

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div class="d-flex align-items-center gap-2 flex-wrap">

                        <img src="cow.png" alt="La Vache" style="height:32px;">

                        <span class="fw-normal fs-5">
                            -Today's Last Rooms-
                        </span>                        
                    </div>

                    <div id="tm-clock-box">
    <div id="tm-clock">
        Lundi 28 Septembre | 23:42:35
    </div>
</div>

                </div>

                <!-- Offre -->

                <div class="row align-items-center g-2 mb-3">

                    <div class="col">
                        <input type="text" id="hotel-name" class="form-control form-control-sm fw-bold" value="Hilton"
                            readonly>
                    </div>

                    <div class="col-auto">
                        <span id="hotel-cat" class="badge bg-secondary badge-offer">
                            4★
                        </span>
                    </div>

                    <div class="col-auto">
                        <span id="hotel-room" class="badge bg-info text-dark badge-offer">
                            Double
                        </span>
                    </div>

                    <div class="col-auto">
                        <span id="hotel-price" class="badge bg-success badge-offer">
                            89€
                        </span>
                    </div>

                </div>

                <!-- Adresse -->

                <div id="hotel-address" class="small text-muted mb-3">

                    📍 10 Rue de Paris, 75001 Paris

                </div>

                <!-- Contact -->

                <div id="hotel-contact" class="small mb-3">

                    📞 +33 1 00 00 00 00

                    <br>

                    ✉ hotel@email.fr

                </div>

                <!-- Actions -->

                <div class="row g-2 mb-3">

                    <div class="col-4">

                        <button class="btn btn-primary btn-sm w-100" onclick="shareOffer()">
                            Share
                        </button>

                    </div>

                    <div class="col-4">

                        <button class="btn btn-secondary btn-sm w-100" onclick="showQRCode()">
                            QR Code
                        </button>

                    </div>

                    <div class="col-4">

                        <button class="btn btn-success btn-sm w-100" onclick="reserveOffer()">
                            Réserver
                        </button>

                    </div>

                </div>

                <!-- PWA -->

                <div class="row g-2">

                    <div class="col-6">

                        <button class="btn btn-warning btn-sm w-100" onclick="askNotificationPermission()">
                            Notification
                        </button>

                    </div>

                    <div class="col-6">

                        <button class="btn btn-primary btn-sm w-100" onclick="installApp()">
                            Installer
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        /* Date + Horloge */

function updateHeader() {

    const now = new Date();

    const weekday = now.toLocaleDateString('fr-FR', {
        weekday: 'long'
    });

    const month = now.toLocaleDateString('fr-FR', {
        month: 'long'
    });

    const day = String(now.getDate()).padStart(2, '0');

    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');

    const dateText =
        weekday.charAt(0).toUpperCase() +
        weekday.slice(1) +
        ' ' +
        day +
        ' ' +
        month.charAt(0).toUpperCase() +
        month.slice(1);

    document.getElementById('tm-clock').textContent =
        `${dateText} | ${h}:${m}:${s}`;
}

updateHeader();
setInterval(updateHeader, 1000);

        updateHeader();
        setInterval(updateHeader, 1000);

        /* Chargement offre */

        async function loadOffer() {

            try {

                const response = await fetch('list.php');

                const data = await response.json();

                document.getElementById('hotel-name').value =
                    data.hotel_nom || '';

                document.getElementById('hotel-cat').textContent =
                    data.hotel_cat || '';

                document.getElementById('hotel-room').textContent =
                    data.hotel_chbcat || '';

                document.getElementById('hotel-price').textContent =
                    data.hotel_prix || '';

                document.getElementById('hotel-address').innerHTML =
                    '📍 ' + (data.adresse || '');

                document.getElementById('hotel-contact').innerHTML =
                    '📞 ' + (data.tel || '') +
                    '<br>✉ ' + (data.email || '');

            }
            catch (error) {

                console.error(error);

            }
        }

        loadOffer();

        /* Share */

        async function shareOffer() {

            if (navigator.share) {

                await navigator.share({
                    title: 'La Vache',
                    text: 'Découvrez l’offre du jour',
                    url: window.location.href
                });

            } else {

                navigator.clipboard.writeText(window.location.href);

                alert('Lien copié');
            }
        }

        /* QR Code */

        function showQRCode() {

            alert('QR Code à connecter plus tard');
        }

        /* Réservation */

        function reserveOffer() {

            window.location.href = 'reserve.php';
        }

        /* Notifications */

        function askNotificationPermission() {

            Notification.requestPermission();
        }

        /* Installation PWA */

        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {

            e.preventDefault();

            deferredPrompt = e;
        });

        async function installApp() {

            if (!deferredPrompt) {

                alert('Installation non disponible');

                return;
            }

            deferredPrompt.prompt();

            await deferredPrompt.userChoice;
        }

    </script>

</body>

</html>

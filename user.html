<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>La Vache - Offre du jour</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.offer-card{
    max-width:700px;
    margin:auto;
}

</style>

</head>

<body>

<div class="container py-3">

    <div class="card offer-card shadow-sm">

        <div class="card-body">

            <!-- Header -->

            <div class="row align-items-center g-2 mb-3">

                <div class="col-auto">
                    <img src="cow.png"
                         alt="La Vache"
                         style="height:32px;">
                </div>

                <div class="col-auto fw-bold fs-5">
                    La Vache
                </div>

                <div class="col-auto">
                    <span id="popup-date"
                          class="text-muted fw-semibold"
                          style="font-size:15px; white-space:nowrap;">
                    </span>
                </div>

                <div class="col-auto">
                    <span id="digital-clock"
                          class="text-muted fw-semibold"
                          style="font-size:15px; white-space:nowrap;">
                    </span>
                </div>

            </div>

            <!-- Ligne 1 -->

            <div class="row g-1 mb-2">

                <div class="col">
                    <input type="text"
                           class="form-control form-control-sm"
                           value="Hilton"
                           readonly>
                </div>

                <div class="col-auto">
                    <input type="text"
                           class="form-control form-control-sm"
                           value="4★"
                           readonly
                           style="width:70px;">
                </div>

                <div class="col-auto">
                    <input type="text"
                           class="form-control form-control-sm"
                           value="Double"
                           readonly
                           style="width:110px;">
                </div>

                <div class="col-auto">
                    <input type="text"
                           class="form-control form-control-sm"
                           value="89€"
                           readonly
                           style="width:80px;">
                </div>

            </div>

            <!-- Adresse -->

            <div class="mb-2">

                <input type="text"
                       class="form-control form-control-sm"
                       value="10 Rue de Paris, 75001 Paris"
                       readonly>

            </div>

            <!-- Téléphone / Email -->

            <div class="row g-2 mb-3">

                <div class="col-4">

                    <input type="text"
                           class="form-control form-control-sm"
                           value="+33 1 00 00 00 00"
                           readonly>

                </div>

                <div class="col-8">

                    <input type="email"
                           class="form-control form-control-sm"
                           value="hotel@email.fr"
                           readonly>

                </div>

            </div>

            <!-- Actions -->

            <div class="row g-2 mb-3">

                <div class="col">
                    <button class="btn btn-primary btn-sm w-100">
                        Share
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-secondary btn-sm w-100">
                        QR Code
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-success btn-sm w-100">
                        Réserver
                    </button>
                </div>

            </div>

            <!-- PWA -->

            <div class="row g-2">

                <div class="col-6">
                    <button class="btn btn-warning btn-sm w-100">
                        Activer la notification
                    </button>
                </div>

                <div class="col-6">
                    <button class="btn btn-primary btn-sm w-100">
                        Installer l'Application
                    </button>
                </div>

            </div>

        </div>

    </div>

</div>

<script>

function updateHeader() {

    const now = new Date();

    const options = {
        weekday: 'long',
        day: '2-digit',
        month: 'long'
    };

    let date = now.toLocaleDateString('fr-FR', options);

    date =
        date.charAt(0).toUpperCase() +
        date.slice(1);

    date = date.replace(
        /(\d{2})\s([a-zà-ÿ]+)/i,
        (m, d, month) =>
            d + ' ' +
            month.charAt(0).toUpperCase() +
            month.slice(1)
    );

    document.getElementById('popup-date').textContent = date;

    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');

    document.getElementById('digital-clock').textContent =
        h + ':' + m;
}

updateHeader();
setInterval(updateHeader, 1000);

</script>

</body>
</html>

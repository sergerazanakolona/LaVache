<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaVache - Offres de dernière minute</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #f0f2f5; }
    .card-offer {
      border-radius: 1rem;
      max-width: 520px;
      margin: 0 auto;
    }
    .logo-hotel {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 8px;
    }
    .stars { font-size: 1.35rem; letter-spacing: 1px; }
    .price-badge { font-size: 1.05rem; padding: 0.45rem 0.9rem; }
    .clock { font-variant-numeric: tabular-nums; font-weight: 600; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-building me-2"></i>LaVache
      </a>
      <span class="navbar-text text-white-50">Offres valables jusqu'à minuit</span>
    </div>
  </nav>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0">Offres de dernière minute</h4>
      <span class="badge bg-danger fs-6">1 offre disponible</span>
    </div>

    <div id="offersCarousel" class="carousel slide" data-bs-ride="false">
      <div class="carousel-inner">

        <!-- OFFRE 1 -->
        <div class="carousel-item active">
          <div class="card card-offer shadow">
            <div class="card-body p-4">

              <!-- Ligne 0 avec horloge -->
              <div class="d-flex justify-content-between align-items-start mb-3">
                <div class="d-flex align-items-center gap-2">
                  <img src="vache.png" alt="Logo hôtel" class="logo-hotel">
                  <div>
                    <div class="small text-muted">samedi 7 novembre</div>
                    <div class="small fw-bold">
                      Expire à minuit | <span id="liveClock" class="clock">00:00:00</span>
                    </div>
                  </div>
                </div>
                <span class="badge bg-danger">Dernière minute</span>
              </div>

              <!-- Ligne 1 -->
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                  <span class="fw-bold fs-5">Hotel de Paris</span>
                  <span class="text-warning stars ms-2">****</span>
                </div>
                <span class="badge bg-success-subtle text-success border border-success fw-semibold price-badge">
                  Double | 230 €
                </span>
              </div>

              <!-- Ligne 2 -->
              <div class="d-flex justify-content-center align-items-center gap-4 mb-4">
                <div class="text-muted small">
                  <i class="bi bi-geo-alt"></i> 17 rue Méridien, Paris 75015
                </div>
                <div class="d-flex gap-3">
                  <a href="tel:+33123456789" class="text-decoration-none">
                    <i class="bi bi-telephone-fill text-primary fs-5"></i>
                  </a>
                  <a href="mailto:contact@hotel-de-paris.fr" class="text-decoration-none">
                    <i class="bi bi-envelope-fill text-primary fs-5"></i>
                  </a>
                </div>
              </div>

              <!-- Boutons -->
              <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary flex-fill">
                  <i class="bi bi-share"></i> Partager
                </button>
                <a href="https://www.hotel-de-paris.fr/offre" target="_blank" class="btn btn-success flex-fill">
                  <i class="bi bi-calendar-check"></i> Réserver
                </a>
              </div>

              <div class="text-center mt-2">
                <small class="text-muted">
                  <i class="bi bi-shield-check text-success"></i>
                  Lien sécurisé vers le site officiel de l’hôtel
                </small>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Horloge en temps réel
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').textContent = `${h}:${m}:${s}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
